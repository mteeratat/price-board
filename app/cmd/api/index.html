<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="60">
  <title>Price Board</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; }
    th, td { padding: 0.5rem 1rem; border-bottom: 1px solid #ddd; text-align: left; }
    td.price { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>Price Board</h1>
  <table>
    <tr><th>Symbol</th><th>Price</th><th>Updated (UTC)</th></tr>
    {{range .}}
    <tr>
      <td>{{.Symbol}}</td>
      <td class="price">{{.Price}}</td>
      <td>{{.FetchedAt.UTC.Format "2006-01-02 15:04:05"}}</td>
    </tr>
    {{else}}
    <tr><td colspan="3">No data yet. Run the fetcher.</td></tr>
    {{end}}
  </table>
</body>
</html>
