services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432" # localhost only
    volumes:
      - pgdata:/var/lib/postgresql # 18+ path (was .../data before 18)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  # One-shot: applies migrations, then exits.
  migrate:
    image: migrate/migrate:v4.19.0
    volumes:
      - ./app/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./app
    image: price-board:dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080" # localhost only
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-shot: fetches once, then exits. Re-run with `docker compose run --rm fetcher`.
  fetcher:
    build: ./app
    image: price-board:dev
    entrypoint: ["/app/fetcher"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      SYMBOLS: ${SYMBOLS}
      BINANCE_PRICE_URL: ${BINANCE_PRICE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
